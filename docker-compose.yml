services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-1536}
      TZ: ${TZ:-America/Lima}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q 'SELECT 1'",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  # Job rápido: solo crea la base transaccional y, si SEED_DATA=true, el seed.
  # La aplicación transaccional espera a este job, no al ETL dimensional.
  db-init:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: control-salud-cerebral-db-init:local
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD}
      INIT_MODE: oltp
      SEED_DATA: ${SEED_DATA:-false}
      RESET_DB: ${RESET_DB:-false}
    depends_on:
      sqlserver:
        condition: service_healthy
    restart: "no"

  # Job del Data Mart: ejecuta 01-05, carga dimensiones/hechos y crea el login BI.
  # El backend BI espera a que termine; el backend transaccional no.
  db-mart-init:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    image: control-salud-cerebral-db-init:local
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD}
      INIT_MODE: mart
      RESET_MART: ${RESET_MART:-false}
      BI_DB_USER: ${BI_DB_USER:-bi_lector}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD:-}
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    restart: "no"

  # Aplicación transaccional.
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      TZ: ${TZ:-America/Lima}
      DB_AUTH_TYPE: sql
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_DATABASE: ${DB_DATABASE:-prevencion_cognitiva_oltp}
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      DEMO_ADMIN_EMAIL: ${DEMO_ADMIN_EMAIL:-admin@saludcerebral.pe}
      DEMO_TITULAR_EMAIL: ${DEMO_TITULAR_EMAIL:-carlos.mendoza@gmail.com}
      DATAMART_SCRIPTS_DIR: /app/bd-dim-sql
    depends_on:
      sqlserver:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy

  # Dashboard BI: solo lectura del Data Mart.
  bi-backend:
    build:
      context: .
      dockerfile: dashboard-bi/backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 4001
      TZ: ${TZ:-America/Lima}
      DATA_SOURCE: sqlserver
      BI_DB_SERVER: sqlserver
      BI_DB_PORT: 1433
      BI_DB_DATABASE: prevencion_cognitiva_mart
      BI_DB_USER: ${BI_DB_USER:-bi_lector}
      BI_DB_PASSWORD: ${BI_DB_PASSWORD:-}
      BI_DB_ENCRYPT: "true"
      BI_DB_TRUST_SERVER_CERTIFICATE: "true"
      ADMIN_USER: ${BI_ADMIN_USER:-}
      ADMIN_PASSWORD_HASH: ${BI_ADMIN_PASSWORD_HASH:-}
      JWT_SECRET: ${BI_JWT_SECRET:-}
      JWT_EXPIRES_IN: ${BI_JWT_EXPIRES_IN:-8h}
    depends_on:
      db-mart-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  bi-frontend:
    build:
      context: .
      dockerfile: dashboard-bi/frontend/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    depends_on:
      bi-backend:
        condition: service_healthy

  # Administración web de las dos bases (CloudBeaver). Solo accesible con dominio propio.
  cloudbeaver:
    build:
      context: .
      dockerfile: docker/cloudbeaver/Dockerfile
    environment:
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "false"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD}
    volumes:
      - cloudbeaver-data:/opt/cloudbeaver/workspace
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8978"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  mssql-data:
  cloudbeaver-data:
