services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Developer}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD}
      MSSQL_MEMORY_LIMIT_MB: ${MSSQL_MEMORY_LIMIT_MB:-1536}
      TZ: ${TZ:-America/Lima}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -b -Q 'SELECT 1'",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PORT: 4000
      NODE_ENV: production
      TZ: ${TZ:-America/Lima}
      DB_AUTH_TYPE: sql
      DB_SERVER: sqlserver
      DB_PORT: 1433
      DB_DATABASE: ${DB_DATABASE:-prevencion_cognitiva_oltp}
      DB_USER: sa
      DB_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD}
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET:?define JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATAMART_SCRIPTS_DIR: /app/bd-dim-sql
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy

  # Inicialización única de ambas bases (OLTP, seed y Data Mart).
  # Ejecutar a mano: docker compose --profile init run --rm db-init
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["init"]
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?define MSSQL_SA_PASSWORD}
      SEED_DATA: ${SEED_DATA:-false}
      RESET_DB: ${RESET_DB:-false}
    entrypoint: ["/bin/bash", "/scripts/init.sh"]
    volumes:
      - ./bd-sql:/scripts/bd-sql:ro
      - ./bd-dim-sql:/scripts/bd-dim-sql:ro
      - ./deploy/init.sh:/scripts/init.sh:ro
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  mssql-data:
