    restart: unless-stopped
  backend:
    restart: unless-stopped
  frontend:
    restart: unless-stopped
  bi-backend:
    restart: unless-stopped
  bi-frontend:
    restart: unless-stopped
  cloudbeaver:
    restart: unless-stopped
